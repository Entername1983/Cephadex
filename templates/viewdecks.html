{% extends "layout.html" %}

{% block title %} View Decks {% endblock %}

{% block main_0 %}
<div class="col-10-md box_0 mx-2 my-5 py-5">
 
    <table class="table table_0 mobile-optimised">

        <thead>
            <tr>
                <th>Deck Name: </th>
                <th>Description: </th>
                <th>Number of cards: </th>
                <th>Cards due: </th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for deck in decks%}

            <tr>
                <td class = "ml-2" data-th="Deck Name:">
                    <form action="" method="post">
                        <input type="hidden" name="deck_id" value="{{ deck.id }}">
                        <input 
                            class = "border-0"
                          name="new_name"
                          id="deck.id"
                          value="{{ deck.name }}"
                          placeholder="{{ deck.name }}"
                          onchange="this.form.submit();"
                        />
                        </form>
                
                </td>
                <td data-th="Description:">{{ deck.description }}</td>
                <td data-th="Number of Cards:"> {{ deck.quantity_cards() }} </td>
                <td data-th="Cards Due:"> {{deck.qty_cards_due() }} </td>
                

                <td>

                    <a href="/currentdeck/{{deck.id}}">
                        <img src="\static\edit-box-icon.png" alt="Edit" style="max-width:30px;max-height:30px;" class ="px-1" title = "Edit">
                      </a>


                      <a href="/study_deck/{{deck.id}}">
                        <img src="\static\graduation-cap-icon.png" alt="Study" style="max-width:30px;max-height:30px;"class ="px-1" title = "Study">
                      </a>
                      <a href="/downloadascsv/{{deck.id}}">
                        <img src="\static\download-csv-icon.png" alt="Download CSV" style="max-width:30px;max-height:30px;"class ="px-1" title ="Download as CSV">
                      </a>
                      <a href="#" onclick="if (confirm('Are you sure you want to delete this deck?')) { window.location.href = '/delete/{{deck.id}}'; }">
                        <img src="\static\delete-icon.png" alt="Delete" style="max-width:30px;max-height:30px;" class ="px-1" title="Delete deck">
                      </a>
                    
                                <a href="/currentdeck/{{deck.id}}"></a>
                    
                                <a href="/study_deck/{{deck.id}}"></a>
                        
                                <a href="/downloadascsv/{{deck.id}}"></a>
                     
                                <a href="/delete/{{deck.id}}"></a>
                             
                </td>
</div>

</div>
</div>
</div>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>







{% endblock %}
