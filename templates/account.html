{% extends "layout.html" %} {% block title %} Extractor {% endblock %} {% block
main_0 %}




<div class="col box_0 p-3 m-2">
  <form>
    <div class="accordion" id="accordionExample">
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingOne">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne"
            aria-expanded="true" aria-controls="collapseOne">
            Account information:
          </button>
        </h2>
        <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
          data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <div class="row">

              <div class="col-6">
                <div class="row">
                  <label for="first_name">First Name:</label>
                  <input name="term" class="card-title box_study input_0 form-control form-control-lg" type="text"
                    id="first_name" placeholder="{{ user.first_name }}" value="{{ user.first_name }}" />
                </div>
                <div class="row">
                  <label for="last_name">Last Name:</label>
                  <input name="term" class="card-title box_study input_0 form-control form-control-lg" type="text"
                    id="last_name" placeholder="{{ user.last_name }}" value="{{ user.last_name }}" />
                </div>
                <div class="row">
                  <label for="username">Username:</label>
                  <input name="term" class="card-title box_study input_0 form-control form-control-lg" type="text"
                    id="username" placeholder="{{ user.username }}" value="{{ user.username }}" />
                </div>
                <div class="row">
                  <label for="email">Email:</label>
                  <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text"
                    id="email" placeholder="{{ user.email }}" value="{{ user.email }}"> {{ user.email }} </p>
                </div>
                <div class = "row">
                  <label for="gender">Gender:</label>
                  <select id="gender" name="gender"class="card-title box_study input_0 form-control form-control-lg">
                    <option value="volvo">Female</option>
                    <option value="saab">Male</option>
                    <option value="fiat">Other</option>
                    <option value="audi">Prefer not to say</option>
                  </select>
                </div>
              </div>
              <br>
              <div class="col-6" style="text-align:center">
                <img src="static/logo1.png" style="max-height:fit-content; max-width:fit-content;" alt="logo">
              </div>
  
            </div>
            <div class="row">
              <label for="email">Account type:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> Free </p>
              <label for="email">Member since:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> 00-00-0000 </p>
              <div class="row">
                <label for="checkbox">Receive email notifications:</label>
                <input class=" " type="checkbox" id="checkbox" name="checkbox" value="checkbox" />
              </div>

            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingTwo">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo"
            aria-expanded="true" aria-controls="collapseTwo">
            Study stats:
          </button>
        </h2>
        <div id="collapseTwo" class="accordion-collapse collapse show" aria-labelledby="headingTwo"
          data-bs-parent="#accordionExample">
          <div class="accordion-body">




            <div class="row">

              <label for="email">Hours spent studying:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> 25 </p>
              <label for="email">Number of decks:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> 5 </p>
              <label for="email">Number of cards:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> 100 </p>
              <label for="email">Cards learnt:</label>
              <p name="term" class="card-title box_study input_0 form-control form-control-lg" type="text" id="email"
                placeholder="" value=""> 75 </p>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingThree">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree"
            aria-expanded="true" aria-controls="collapseThree">
            Billing information:
          </button>
        </h2>
        <div id="collapseThree" class="accordion-collapse collapse show" aria-labelledby="headingThree"
          data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <div class="row">

              <div class="row">
                <label for="card_number">Card Number:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="card_number"
                  name="card_number" required>
              </div>

              <div class="row">
                <label for="card_name">Name on Card:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="card_name"
                  name="card_name" required>
              </div>

              <div class="row">
                <label for="card_expiry">Expiry Date:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="card_expiry"
                  name="card_expiry" placeholder="MM / YY" required>
              </div>

              <div class="row">
                <label for="card_cvc">CVC:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="card_cvc"
                  name="card_cvc" required>
              </div>

              <div class="row">
                <label for="billing_address">Billing Address:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text"
                  id="billing_address" name="billing_address" required>
              </div>

              <div class="row">
                <label for="billing_city">City:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="billing_city"
                  name="billing_city" required>
              </div>

              <div class="row">
                <label for="billing_state">State:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="billing_state"
                  name="billing_state" required>
              </div>

              <div class="row">
                <label for="billing_zip">Zip Code:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text" id="billing_zip"
                  name="billing_zip" required>
              </div>

              <div class="row">
                <label for="billing_country">Country:</label>
                <input class="card-title box_study input_0 form-control form-control-lg" type="text"
                  id="billing_country" name="billing_country" required>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

<div class = "row mt-2">
  <div class = "col-6">
    <button type="submit" class="btn btn-primary">Save changes</button>
    </div>
  </form>
  <div class = "col-6">
    <button type="button" class="btn btn-primary">Delete account</button>
    </div>
</div>
</div>
</div>

{% endblock %}
