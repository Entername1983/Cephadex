{% extends "layout.html" %} {% block title %} Printable AI Generated Study Notes, Summaries and Transcriptions {% endblock %} 
{% block head %} 


<style type="text/css" media="print">
    @page 
    {
        size:  auto;   /* auto is the initial value */
        margin: 0mm;  /* this affects the margin in the printer settings */
    }

    html
    {
        background-color: #FFFFFF; 
        margin: 10px;  /* this affects the margin on the html before sending to printer */
    }

    body
    {
        margin: 10mm 15mm 10mm 15mm; /* margin you want for the content */
    }
    @media print {
        .navbar { /* Assuming .navbar is the class of your navigation bar */
            display: none!important;
        }
        body * {
            visibility: hidden;
        }
        #printable, #printable * {
            visibility: visible;
        }
        #printable-container {
            /* Adjust margins and other styles for the printable content */
            margin: 0;
            padding: 0;
        }
    }
    </style>

{% endblock %}
{% block
    main_0 %}


<div class = "container-fluid printable-container printable">
    <div class="row">
        <div class="col-1">
        <img src="/static/Cepha-banner-1.png" style="max-height:75px">
        <br>
        <br>
    </div>
    </div>

    <div>
        <h1>{{file.file_name}}</h1>
        <br>
        <div>
            {{ file.text_string | safe }}</div>
    </div>

</div>

{% endblock %}
