

{% extends "layout.html" %}

{% block title %} View documents {% endblock %}

{% block main_0 %}

<div class="col-10-md box_0 m-3 p-3">
  <div class="row">
    <div class="col-md-6">
      <form action="" method="get">

        <div class="row justify-content-end">
          <div class="row ">
            <div class="col">
              <input type="text" class="form-control mb-2 box_study" id="search-deck-name" style="max-width:300px"
                name="search" placeholder="Search decks by name" value="{{ request.args.get('search', '') }}">
            </div>
            <div class="col">
              <button type="submit" class="btn btn-primary mb-2">Search</button>
            </div>
          </div>
          <div class="row justify-content-end">
            <form action="" method="get">
              <div id='sort-form'>
                <label class="my-1 mr-2" for="sort-decks">Sort by:</label>
                <select class="custom-select my-1 mr-sm-2" id="sort" name="sort" onchange="this.form.submit();">
                  <option value="default">Select sort method</option>
                  <option value="name_asc">Name (A to Z)</option>
                  <option value="name_desc">Name (Z to A)</option>
                  <option value="cards_due_asc">Cards Due (Low to High)</option>
                  <option value="cards_due_desc">Cards Due (High to Low)</option>
                  <option value="category_asc">Category (A to Z)</option>
                  <option value="create_time_asc">Date created (earliest first)</option>
                  <option value="create_time_dsc">Date created (latest first)</option>
                </select>
              </div>
            </form>
          </div>
        </div>

      </form>
    </div>
  </div>
  <table class="table table_0 mobile-optimised2">

    <table class="table table_0 mobile-optimised">

      <thead>
        <tr>
          <th>File name: </th>
          <th>Type: </th>
          <th>Date created: </th>
          <th>Actions:</th>
        </tr>
      </thead>
      <tbody>
        {% for file in deck.deck_files %}

        <tr>

          <td data-th="File name:">{{ file.file_name }}</td>
          <td data-th="Type:"> {{ file.create_type }} </td>
          <td data-th="Date created:"> {{file.time_created }}</td>"



          <td>


            <a href="/download_source/{{file.id}}" class="mx-2">
              <img src="\static\download-pdf-icon.png" alt="Download PDF" style="max-width:30px;max-height:30px;"
                class="px-1" title="Download as CSV">
            </a>

            <a href="#" class="mx-2"
              onclick="if (confirm('Are you sure you want to delete this deck?')) { window.location.href = '/delete_file/{{file.id}}'; }">
              <img src="\static\delete-icon.png" alt="Delete" style="max-width:30px;max-height:30px;" class="px-1"
                title="Delete File">
            </a>
          </td>
</div>

</div>
</div>
</div>
</td>
</tr>
{% endfor %}
</tbody>
</table>
</div>







{% endblock %}
