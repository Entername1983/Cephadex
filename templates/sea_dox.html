{% extends "layout.html" %}

{% block title %} View documents {% endblock %}

{% block main_0 %}
<div class = "container" style="text-align:center">
<h3> View files for {{deck.name}}:</h3>
</div>

<div class="col-10-md box_0 m-3 p-3">
    <div class="row">
        <div class="col-md-6">
            <form action="" method="get">

                <div class="row justify-content-end">
                    <div class="row ">
                        <div class="col">
                            <input type="text" class="form-control mb-2 box_study" id="search-deck-name"
                                style="max-width:300px" name="search" placeholder="Search documents by name"
                                value="{{ request.args.get('search', '') }}">
                        </div>
                        <div class="col">
                            <button type="submit" class="btn btn-primary mb-2">Search</button>
                        </div>
                    </div>
                    <div class="row justify-content-end">
                        <form action="" method="get">
                            <div id='sort-form'>
                                <label class="my-1 mr-2" for="sort-decks">Sort by:</label>
                                <select class="custom-select my-1 mr-sm-2" id="sort" name="sort"
                                    onchange="this.form.submit();">
                                    <option value="default">Select sort method</option>
                                    <option value="date">Date</option>
                                    <option value="name_asc">Name (A-Z)</option>
                                    <option value="name_desc">Name (Z-A)</option>
                                    <option value="type">Type</option>
                                </select>
                            </div>
                        </form>
                    </div>
                </div>

            </form>
        </div>
    </div>
    <table class="table table_0 mobile-optimised2">

        <table class="table table_0 mobile-optimised">

            <thead>
                <tr>
                    <th>Document name: </th>
                    <th>Type: </th>
                    <th>Date created: </th>
                    <th>Actions:</th>
                </tr>
            </thead>
            <tbody>
                {% for file in files %}
                <tr>
                    <td data-th="File name:">
                        <form action="" method="post">
                            <input type="hidden" name="file_id" value="{{ file.id }}">
                            <input class="border-0" style="width: 400px" name="new_name" id="file.id"
                                value="{{ file.file_name }}" placeholder="{{ file.file_name }}"
                                onchange="this.form.submit();" />
                        </form>
                    </td>
                    <td data-th="Type:"> {{ file.create_type }} </td>
                    <td data-th="Date created:"> {{file.time_created }}</td>"
                    <td>
                        <a href="/download_source/{{file.id}}" class="mx-2">
                            <img src="\static\download-pdf-icon.png" alt="Download PDF"
                                style="max-width:30px;max-height:30px;" class="px-1" title="Download as CSV">
                        </a>

                        <a href="#" class="mx-2"
                            onclick="if (confirm('Are you sure you want to delete this deck?')) { window.location.href = '/delete_file/' + {{ deck.id }} + '/' + {{ file.id }} + '/'; }">
                            <img src="\static\delete-icon.png" alt="Delete" style="max-width:30px;max-height:30px;"
                                class="px-1" title="Delete File">
                        </a>
                    </td>
</div>

</div>
</div>
</div>
</td>
</tr>
{% endfor %}


</tbody>
</table>
</div>







{% endblock %}
