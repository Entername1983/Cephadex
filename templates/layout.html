<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width">

        <!-- http://getbootstrap.com/docs/5.1/ -->
        <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
        <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"></script>


        <link href="..\static\style.css" rel="stylesheet">
        
        <title>Edu-MC-8 {% block title %}{% endblock %}</title>

    </head>

    <body>
        <div class="container">
            <div class="row">
                {% if current_user.is_authenticated %}
                <div class="col-6">
                    <div class="d-grid gap-2">
                    <a href="/account" class="btn btn-primary btn-lg border btn-block" role="button">My account</a>
                    </div>
                </div>
                <div class="col-6">
                    <div class="d-grid gap-2">
                    <a href="/study" class="btn btn-primary btn-lg btn-block" role="button">Study</a>
                    </div>
                </div>
                {% else %}
                <div class="col-6">
                    <div class="d-grid gap-2">
                    <a href="/login" class="btn btn-primary btn-lg border btn-block" role="button">Log in</a>
                    </div>
                </div>
                <div class="col-6">
                    <div class="d-grid gap-2">
                    <a href="/register" class="btn btn-primary btn-lg btn-block" role="button">Register</a>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>

        <div class="container">

            {% block main_0 %}

            {% endblock %}

        </div>
    </body>

</html>
