{% extends "layout.html" %} {% block title %} Card Editor {% endblock %} 



{% block head %} 
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
<script type='text/javascript'>
$(document).ready(function(){
  


// If hide button is clicked, delete the post
document.addEventListener('click', event => {

  // Find what was clicked on
  const element = event.target;

  // Check if the user clicked on a hide button
  if (element.id === 'hide') {
      element.parentElement.remove()
  }
  
});





 // Show Input element
 $('.edit').click(function(){
  $('.txtedit').hide();
  $(this).next('.txtedit').show().focus();
  $(this).hide();
 });
 
 // Save data
 $(".txtedit").focusout(function(){
   
  // Get edit id, field name and value
  var id = this.id;
  var split_id = id.split("_");
  var field_name = split_id[0];
  var edit_id = split_id[1];
  var value = $(this).val();
   
  // Hide Input element

 
  // Hide and Change Text of the container with input elmeent
  $(this).prev('.edit').show();
  $(this).prev('.edit').text(value);
 
  $.ajax({
   url: '/cardeditor',
   type: 'post',
   // for example term, value, card id
   data: { field:field_name, value:value, id:edit_id },
   success:function(response){
      if(response == 1){ 
         console.log('Save successfully'); 
      }else{ 
         console.log("Not saved.");  
      }
   }
  });
  
 });
 
});
</script>
{% endblock %}



{% block main_0 %}



<div class="container" >
  <div class="row" style="padding:50px;">
      <p><h1>Edit your deck</h1></p>
       {% for card in deck %}    
       <div class="row px-2">
        <div class="card rounded border my-2">
          <div class="card-body">

            <h5 id = '{{card.id}}' class="card-title border rounded py-4 px-2">
              <input type='text' class='txtedit form-control' value='{{card.term}}' id='term_{{card.id}}' >
            </h5>
            <p class="card-text border rounded py-4 px-2">
              <input type='text' class='txtedit form-control' value='{{card.content}}' id='content_{{card.id}}' >
            </p>
            
          </div>
          <div class = "col-6">
          <button class="btn btn-primary" id = "hide" type="submit">Save</button>
        </div>
        <div class = "col-6">
          <button class="btn btn-primary" id = "delete" type="submit">Delete</button>
        </div>
        </div>
      </div>
       {% endfor %} 
      </table>
 </div>
</div>




{% endblock %}
